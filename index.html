<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071d1c">
  <meta name="description" content="Сашечка, родная, с днём рождения!">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:title" content="Сашечка, с днём рождения!">
  <meta property="og:description" content="Это тебе )">
  <meta property="og:type" content="website">
  <title>Сашечка, с днём рождения!</title>
  <link rel="icon" href="./assets/lotus-generated.png" type="image/png">
  <link rel="stylesheet" href="./assets/fonts.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./letter.css">
  <link rel="stylesheet" href="./candles.css">
  <link rel="stylesheet" href="./music.css">
  <link rel="preload" as="image" href="./assets/moonlit-garden.png" fetchpriority="high">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#story">К открытке</a>
  <main id="story" tabindex="-1" aria-label="Открытка для Саши"></main>
  <footer class="site-footer">
    <div class="footer-top"><span class="journey-label">СТРАНИЦЫ</span><span id="chapter-count">01 / 06</span></div>
    <nav id="chapters" aria-label="Главы открытки"></nav>
  </footer>
  <div class="ambient-controls">
    <button class="music-toggle" id="music-toggle" aria-expanded="false" aria-controls="music-panel" aria-label="Включить музыку Chanakya"><span class="icon icon-sound" aria-hidden="true"></span><span>Музыка</span></button>
    <button class="sound-button" id="sound-toggle" data-action="sound" aria-pressed="false" aria-label="Включить звуковые эффекты"><span class="icon icon-muted" aria-hidden="true"></span><span>Звук выключен</span></button>
  </div>
  <section id="music-panel" class="music-panel" aria-labelledby="music-title" data-state="off" hidden>
    <div class="music-panel-heading"><h2 id="music-title">Chanakya</h2><button id="music-close" class="music-close" aria-label="Выключить музыку и закрыть плеер">Выключить</button></div>
    <p class="music-credit">Rishab Rikhiram Sharma</p>
    <div class="music-video-wrap"><div id="music-video"></div></div>
    <p id="music-status" class="music-status" role="status" aria-live="polite">Включается только по твоему желанию.</p>
    <label class="music-volume" for="music-volume">Громкость <output id="music-volume-value" for="music-volume">70%</output><input id="music-volume" type="range" min="0" max="100" step="1" value="70" aria-label="Громкость музыки" aria-valuetext="70%"></label>
    <div class="music-links">
      <a id="music-watch" class="music-watch" href="https://www.youtube.com/watch?v=2dBHTz6g5AM" target="_blank" rel="noopener noreferrer">Открыть на YouTube</a>
      <a href="https://www.youtube.com/t/terms" target="_blank" rel="noopener noreferrer">Условия</a>
      <a href="https://policies.google.com/privacy" target="_blank" rel="noopener noreferrer">Конфиденциальность</a>
    </div>
  </section>
  <div id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <noscript><div class="no-script">Сашечка, родная, с днём рождения! Обнимаю тебя ) Для интерактивной открытки включи JavaScript в браузере.</div></noscript>
</body>
</html>
